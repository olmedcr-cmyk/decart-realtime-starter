 <circle class="lnk" cx="330" cy="328" r="3"/><path class="lnk" d="M323,340 C324,334 336,334 337,340"/></g>
<g class="fd" style="animation-delay:-0.8999999999999999s"><rect class="ink" x="616" y="386" width="28" height="20"/>
 <rect x="616" y="386" width="28" height="20" fill="url(#scales)"/></g>
<g class="fu" style="animation-delay:-1.2s"><rect class="bg" x="316" y="320" width="28" height="20" style="stroke:var(--ink)"/>
 <circle class="lnk" cx="330" cy="328" r="3"/><path class="lnk" d="M323,340 C324,334 336,334 337,340"/></g>
<g class="fd" style="animation-delay:-1.5s"><rect class="ink" x="616" y="386" width="28" height="20"/>
 <rect x="616" y="386" width="28" height="20" fill="url(#scales)"/></g>
<g class="fu" style="animation-delay:-1.7999999999999998s"><rect class="bg" x="316" y="320" width="28" height="20" style="stroke:var(--ink)"/>
 <circle class="lnk" cx="330" cy="328" r="3"/><path class="lnk" d="M323,340 C324,334 336,334 337,340"/></g>
<g class="fd" style="animation-delay:-2.0999999999999996s"><rect class="ink" x="616" y="386" width="28" height="20"/>
 <rect x="616" y="386" width="28" height="20" fill="url(#scales)"/></g>
<g class="fu" style="animation-delay:-2.4s"><rect class="bg" x="316" y="320" width="28" height="20" style="stroke:var(--ink)"/>
 <circle class="lnk" cx="330" cy="328" r="3"/><path class="lnk" d="M323,340 C324,334 336,334 337,340"/></g>
<g class="fd" style="animation-delay:-2.6999999999999997s"><rect class="ink" x="616" y="386" width="28" height="20"/>
 <rect x="616" y="386" width="28" height="20" fill="url(#scales)"/></g>
<g class="fu" style="animation-delay:-3.0s"><rect class="bg" x="316" y="320" width="28" height="20" style="stroke:var(--ink)"/>
 <circle class="lnk" cx="330" cy="328" r="3"/><path class="lnk" d="M323,340 C324,334 336,334 337,340"/></g>
<g class="fd" style="animation-delay:-3.3s"><rect class="ink" x="616" y="386" width="28" height="20"/>
 <rect x="616" y="386" width="28" height="20" fill="url(#scales)"/></g>
<rect class="lnk" x="660" y="250" width="260" height="190"/>
<line class="gr" x1="630" y1="330" x2="660" y2="330"/>
<line class="gr" x1="630" y1="396" x2="660" y2="396"/>
<text class="mono-s cap sec" x="676" y="274">Decart model</text>
<text class="h1 ink" x="676" y="304">Lucy 2.6</text>
<text class="mono-s txt" x="676" y="328">realtime video editing</text>
<text class="mono-s txt" x="676" y="344">every frame, as it arrives</text>
