<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
<title id="t">Realtime video with Decart</title>
<desc id="d">Animated diagram. A camera sends frames over WebRTC to Decart's Lucy model, which also receives a prompt and an optional reference image, and streams every frame back transformed.</desc>
<style>
svg{--bg:#FFFFFF;--ink:#30302E;--txt:#3B3B3B;--sec:#474747;--line:#C6C5C0;--draw:#8A8984;--soft:#E7E6E1}
@media (prefers-color-scheme:dark){
 svg{--bg:#000000;--ink:#F2F2F2;--txt:#E7E6E1;--sec:#C6C5C0;--line:#474747;--draw:#8A8984;--soft:#30302E}
}
.bg{fill:var(--bg)} .ink{fill:var(--ink)} .txt{fill:var(--txt)} .sec{fill:var(--sec)}
.ln{stroke:var(--line);stroke-width:1;fill:none}
.lnk{stroke:var(--ink);stroke-width:1;fill:none}
.gr{stroke:var(--draw);stroke-width:1;fill:none}
.dash{stroke-dasharray:3 4}
.mono{font-family:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.04em}
.mono-s{font-family:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.04em}
.cap{text-transform:uppercase}
.h1{font-family:'Bricolage Grotesque','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:24px;letter-spacing:-.02em}
.h2{font-family:'Bricolage Grotesque','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;letter-spacing:-.01em}
.h3{font-family:'Bricolage Grotesque','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px}
.end{text-anchor:end} .mid{text-anchor:middle}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }

.fu{animation:fu 3.6s linear infinite}
@keyframes fu{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(300px);opacity:0}}
.fd{animation:fd 3.6s linear infinite}
@keyframes fd{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(-300px);opacity:0}}
.human{animation:human 9s ease-in-out infinite}
@keyframes human{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
.beast{animation:beast 9s ease-in-out infinite}
@keyframes beast{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.cell{animation:cell 2.4s steps(1) infinite}
@keyframes cell{0%{fill:var(--bg)}50%{fill:var(--ink)}}
.inp{animation:inp 9s ease-in-out infinite}
@keyframes inp{0%{transform:translateY(0);opacity:0}6%{opacity:1}22%{transform:translateY(64px);opacity:1}26%,100%{transform:translateY(64px);opacity:0}}
</style>
<rect class="bg" width="960" height="500"/>
<text class="mono cap sec" x="40" y="40">Decart · Lucy</text>
<text class="mono cap sec end" x="920" y="40">Realtime</text>
<line class="ln" x1="40" y1="52" x2="920" y2="52"/>
<text class="h1 ink" x="40" y="96">Camera in, transformed video out</text>
<line class="gr" x1="40" y1="440" x2="300" y2="440"/>
<rect class="gr" x="196" y="224" width="10" height="92"/>
<line class="lnk" x1="204" y1="228" x2="204" y2="312" style="stroke-width:2"/>
<circle class="ink" cx="196" cy="234" r="2.5"/>
<line class="gr" x1="201" y1="316" x2="201" y2="440"/>
<line class="gr" x1="176" y1="440" x2="226" y2="440"/>
<circle class="gr" cx="110" cy="208" r="12"/>
<path class="gr" d="M108,221 L104,320 M104,320 L94,440 M104,320 L116,440"/>
<path class="gr" d="M107,235 L134,280"/>
<line class="gr dash" x1="122" y1="208" x2="194" y2="234"/>
<text class="mono-s sec" x="40" y="462">you · a camera · a screen</text>

<defs><pattern id="scales" width="9" height="8" patternUnits="userSpaceOnUse">
 <path d="M0,8 A4.5,4.5 0 0 1 9,8" fill="none" stroke="var(--bg)" stroke-width="1"/></pattern><clipPath id="screen"><rect x="331" y="133" width="228" height="130"/></clipPath></defs>
<rect class="lnk" x="330" y="132" width="230" height="132"/>
<text class="mono-s sec" x="330" y="122">what you see</text>
<line class="gr dash" x1="206" y1="224" x2="330" y2="264"/>
<g clip-path="url(#screen)">
 <g class="human"><circle class="lnk" cx="445.0" cy="199.3" r="18.4"/><path class="lnk" d="M394.4,266 C396.7,236.1 417.4,226.9 445.0,226.9 C472.6,226.9 493.3,236.1 495.6,266 Z"/><text class="mono-s sec" x="340" y="152">you</text></g>
 <g class="beast"><circle class="ink" cx="445.0" cy="199.3" r="18.4"/><path class="ink" d="M394.4,266 C396.7,236.1 417.4,226.9 445.0,226.9 C472.6,226.9 493.3,236.1 495.6,266 Z"/><circle cx="445.0" cy="199.3" r="18.4" fill="url(#scales)"/><path fill="url(#scales)" d="M394.4,266 C396.7,236.1 417.4,226.9 445.0,226.9 C472.6,226.9 493.3,236.1 495.6,266 Z"/><text class="mono-s sec" x="340" y="152">anything you prompt</text></g>
</g>

<path class="gr" d="M206,270 L290,270 L290,330 L330,330"/>
<path class="gr" d="M330,396 L270,396 L270,290 L206,290"/>
<line class="ln" x1="330" y1="330" x2="630" y2="330"/>
<line class="ln" x1="330" y1="396" x2="630" y2="396"/>
<text class="mono-s sec" x="330" y="308">camera · 1280×720 · 30 fps</text>
<text class="mono-s sec" x="330" y="430">transformed stream, frame by frame</text>
<text class="mono-s sec end" x="630" y="308">WebRTC →</text>
<text class="mono-s sec end" x="630" y="430">← WebRTC</text>

<g class="fu" style="animation-delay:0.0s"><rect class="bg" x="316" y="320" width="28" height="20" style="stroke:var(--ink)"/>
 <circle class="lnk" cx="330" cy="328" r="3"/><path class="lnk" d="M323,340 C324,334 336,334 337,340"/></g>
<g class="fd" style="animation-delay:-0.3s"><rect class="ink" x="616" y="386" width="28" height="20"/>
 <rect x="616" y="386" width="28" height="20" fill="url(#scales)"/></g>
