-delay:-1.36s"/><rect class="cell bg" x="852" y="386" width="14" height="12" style="stroke:var(--line);animation-delay:-1.44s"/><rect class="cell bg" x="874" y="386" width="14" height="12" style="stroke:var(--line);animation-delay:-1.52s"/><rect class="cell bg" x="676" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-1.60s"/><rect class="cell bg" x="698" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-1.68s"/><rect class="cell bg" x="720" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-1.76s"/><rect class="cell bg" x="742" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-1.84s"/><rect class="cell bg" x="764" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-1.92s"/><rect class="cell bg" x="786" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-2.00s"/><rect class="cell bg" x="808" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-2.08s"/><rect class="cell bg" x="830" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-2.16s"/><rect class="cell bg" x="852" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-2.24s"/><rect class="cell bg" x="874" y="406" width="14" height="12" style="stroke:var(--line);animation-delay:-2.32s"/>
